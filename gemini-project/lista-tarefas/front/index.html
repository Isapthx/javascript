<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lista de Tarefas</title>
</head>
<body>
    <main>
        <header>
            <h1>Lista de Tarefas</h1>
        </header>

        <section>
            <input type="text" name="adcTarefa" id="nova-tarefa" placeholder="O que precisa ser feito?">
            <button id="btn-adicionar">Adicionar</button>
        </section>

        <section>
            <ul id="lista-tarefas">
                <li>
                    <input type="checkbox" name="trf1" id="trf1">
                    <label for="tarefa1">Comprar Pão</label>
                    <button class="btn-excluir">Excluir</button>
                </li>

                <li>
                    <input type="checkbox" id="tarefa2" checked>
                    <label for="tarefa2">Estudar HTML</label>
                    <button class="btn-excluir">Excluir</button>
                </li>
            </ul>
        </section>
    </main>
</body>
</html>
